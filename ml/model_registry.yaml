# Model Registry
# Each entry describes a training approach / architecture so you can
# track what changed between experiments.
#
# Reference an entry by its key via --model-details <key> (or the
# model_details field in TrainConfig).  The key and description are
# written into training_sessions.jsonl alongside energy/resource data.

models:
  first_approach:
    name: first_approach
    description: >
      MLP policy (MlpPolicy) with action masking via sb3-contrib.
      Flat observation encodes tile ownership, unit presence, and
      economy state.  Action space: N^2 move + N*7 build + 1 end-turn.
      Reward shaping based on territory and economy differential.

  max_map_action_space:
    name: max_map_action_space
    description: >
      MLP policy (MlpPolicy) with action masking via sb3-contrib, using a
      fixed action space sized to the largest campaign map
      (action_space_hexes=384) so a single model can play every level
      regardless of the maps it trained on.  Reworked self-relative reward:
      per-step shaping on the deltas of the agent's own ownership percentage
      and economy (4*farms - trees), measured against its previous state
      rather than opponents; truncation penalised as heavily as a loss.
      Trained via a manual level-by-level curriculum with win-rate early
      stopping and resume-from-checkpoint.
