<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - Antiyoy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
</head>
<body>
    <div class="game-container">
        <!-- Status Bar -->
        <div class="status-bar" id="statusBar" style="display: flex;">
            <button class="hamburger-icon" id="hamburgerBtn" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="status-items-container">
                <div class="status-item">
                    <span class="status-label" id="statusCityName"></span>
                </div>
                <div class="status-item">
                    <span class="status-label">Funds:</span>
                    <span class="status-value" id="statusFunds">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Profit:</span>
                    <span class="status-value" id="statusProfit">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Owned:</span>
                    <span class="status-value" id="statusOwnedHex">0%</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Turn:</span>
                    <span class="status-value" id="statusTurn">0</span>
                </div>
            </div>
        </div>
        
        <!-- Actions Bar -->
        <div class="actions-bar" id="actionsBar">
            <button class="action-button" id="undoBtn" onclick="undoAction()" title="Undo">
                <span class="action-icon">↶</span>
            </button>
            <div class="build-menu-inline" id="buildMenu" style="display: none;">
                <!-- Build items will be populated here -->
            </div>
            <button class="action-button" id="endTurnBtn" onclick="endTurn()" title="End Turn">
                <span class="action-icon">→</span>
            </button>
        </div>
        
        <!-- Hamburger Menu Overlay and Panel -->
        <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
        <div class="menu-panel" id="menuPanel">
            <div class="menu-header">
                <h2>Menu</h2>
                <button class="close-menu" onclick="toggleMenu()">×</button>
            </div>
            <div class="menu-items">
                <button class="menu-item" onclick="restartGame()">
                    <span class="menu-icon">↻</span>
                    Restart
                </button>
                <button class="menu-item" onclick="saveGame()">
                    <span class="menu-icon">💾</span>
                    Save
                </button>
                <button class="menu-item" onclick="exitGame()">
                    <span class="menu-icon">←</span>
                    Exit
                </button>
                <button class="menu-item" id="soundToggleBtn" onclick="toggleSounds()">
                    <span class="menu-icon">🔇</span>
                    <span id="soundToggleText">Enable Sounds</span>
                </button>
            </div>
        </div>
        
        <!-- Game Canvas -->
        <div class="game-board" id="gameBoard">
            <div class="game-loading">
                <p>Loading game...</p>
            </div>
        </div>
        
        <!-- Win/Lose Modals -->
        <div id="loseModal" class="game-modal-overlay" style="display: none;">
            <div class="game-modal-dialog">
                <div class="game-modal-header">
                    <h2>You lost!</h2>
                </div>
                <div class="game-modal-body">
                    <p id="loseModalWinnerLine"><span id="loseModalWinnerName"></span> player has won the game.</p>
                </div>
                <div class="game-modal-footer">
                    <button class="game-modal-button" onclick="exitToMenu()">Exit</button>
                    <button class="game-modal-button" onclick="showGameStatsModal()">Stats</button>
                </div>
            </div>
        </div>
        
        <div id="gameStatsModal" class="game-modal-overlay" style="display: none;">
            <div class="game-modal-dialog">
                <div class="game-modal-header">
                    <h2>Game stats</h2>
                </div>
                <div class="game-modal-body">
                    <!-- Stats content placeholder -->
                </div>
                <div class="game-modal-footer">
                    <button class="game-modal-button" onclick="closeGameStatsModalAndExit()">Exit</button>
                </div>
            </div>
        </div>
        
        <div id="winModal" class="game-modal-overlay" style="display: none;">
            <div class="game-modal-dialog">
                <div class="game-modal-header">
                    <h2>You win!</h2>
                </div>
                <div class="game-modal-body">
                    <p>Congratulations on your victory!</p>
                </div>
                <div class="game-modal-footer">
                    <button class="game-modal-button" onclick="exitToMenu()">Exit</button>
                    <button class="game-modal-button" onclick="showGameStatsModal()">Stats</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const levelIndex = {{ level_index }};
    </script>
    <script src="{{ url_for('static', filename='js/hex_grid.js') }}"></script>
    <script src="{{ url_for('static', filename='js/animations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game_board.js') }}"></script>
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
