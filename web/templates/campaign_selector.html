<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign - Antiyoy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/campaign.css') }}">
</head>
<body>
    <div class="campaign-container">
        <div class="campaign-header">
            <button class="back-button" onclick="window.location.href='/'">← Back</button>
            <h1>Campaign</h1>
        </div>
        
        <div class="campaign-levels">
            {% for level in levels %}
            <div class="level-card {{ level.type }}" 
                 onclick="selectLevel({{ level.index }})"
                 data-level="{{ level.index }}"
                 data-type="{{ level.type }}"
                 data-difficulty="{{ level.difficulty }}">
                <div class="level-number">{{ level.index }}</div>
                <div class="level-info">
                    <div class="level-difficulty">{{ level.difficulty }}</div>
                    {% if level.completed %}
                    <div class="level-completed">✓</div>
                    {% endif %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/campaign.js') }}"></script>
</body>
</html>
