<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antiyoy - Python Port</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="landing-container">
        <div class="landing-content">
            <h1 class="game-title">Antiyoy</h1>
            <p class="game-subtitle">Python Port</p>
            
            <div class="menu-buttons">
                <button class="menu-button campaign-button" onclick="window.location.href='/campaign'">
                    Campaign
                </button>
                <button class="menu-button load-button" onclick="showLoadGameDialog()">
                    Load Game
                </button>
                <button class="menu-button replay-button" onclick="showReplayDialog()">
                    Replay
                </button>
            </div>
            
            <!-- Load Game Dialog -->
            <div id="loadGameDialog" class="dialog-overlay" style="display: none;">
                <div class="dialog-content">
                    <div class="dialog-header">
                        <h2>Load Game</h2>
                        <button class="dialog-close" onclick="hideLoadGameDialog()">×</button>
                    </div>
                    <div class="dialog-body">
                        <div id="savesList" class="saves-list">
                            <p>Loading saves...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Replay Dialog (spacious) -->
            <div id="replayDialog" class="dialog-overlay replay-dialog-overlay" style="display: none;">
                <div class="dialog-content replay-dialog-content">
                    <div class="dialog-header">
                        <h2>Select Replay</h2>
                        <button class="dialog-close" onclick="hideReplayDialog()">×</button>
                    </div>
                    <div class="dialog-body replay-dialog-body">
                        <div id="replaysList" class="replays-list">
                            <p>Loading replays...</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <script>
                function showLoadGameDialog() {
                    const dialog = document.getElementById('loadGameDialog');
                    dialog.style.display = 'flex';
                    loadSavesList();
                }
                
                function hideLoadGameDialog() {
                    const dialog = document.getElementById('loadGameDialog');
                    dialog.style.display = 'none';
                }
                
                function loadSavesList() {
                    fetch('/api/game/list-saves')
                        .then(response => response.json())
                        .then(data => {
                            const savesList = document.getElementById('savesList');
                            if (data.success && data.saves && data.saves.length > 0) {
                                savesList.innerHTML = '';
                                data.saves.forEach(save => {
                                    const saveItem = document.createElement('div');
                                    saveItem.className = 'save-item';
                                    saveItem.innerHTML = `
                                        <div class="save-info">
                                            <div class="save-name">${save.name}</div>
                                            <div class="save-date">${save.date}</div>
                                        </div>
                                        <div class="save-actions">
                                            <button class="save-load-btn" onclick="loadGame('${save.name}')">Load</button>
                                            <button class="save-delete-btn" onclick="deleteGame('${save.name}')">Delete</button>
                                        </div>
                                    `;
                                    savesList.appendChild(saveItem);
                                });
                            } else {
                                savesList.innerHTML = '<p>No saved games found.</p>';
                            }
                        })
                        .catch(error => {
                            console.error('Error loading saves:', error);
                            document.getElementById('savesList').innerHTML = '<p>Error loading saves.</p>';
                        });
                }
                
                function loadGame(saveName) {
                    fetch('/api/game/load', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ save_name: saveName })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            window.location.href = `/game/${data.level_index || 0}`;
                        } else {
                            alert('Failed to load game: ' + (data.error || 'Unknown error'));
                        }
                    })
                    .catch(error => {
                        console.error('Error loading game:', error);
                        alert('Error loading game');
                    });
                }
                
                function deleteGame(saveName) {
                    if (!confirm(`Are you sure you want to delete "${saveName}"? This action cannot be undone.`)) {
                        return;
                    }
                    
                    fetch('/api/game/delete-save', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ save_name: saveName })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Reload the saves list to reflect the deletion
                            loadSavesList();
                        } else {
                            alert('Failed to delete game: ' + (data.error || 'Unknown error'));
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting game:', error);
                        alert('Error deleting game');
                    });
                }
                
                // Close dialog when clicking outside
                document.getElementById('loadGameDialog').addEventListener('click', function(e) {
                    if (e.target === this) hideLoadGameDialog();
                });

                function showReplayDialog() {
                    document.getElementById('replayDialog').style.display = 'flex';
                    loadReplaysList();
                }
                function hideReplayDialog() {
                    document.getElementById('replayDialog').style.display = 'none';
                }
                function loadReplaysList() {
                    fetch('/api/replays/list')
                        .then(r => r.json())
                        .then(data => {
                            const listEl = document.getElementById('replaysList');
                            if (data.success && data.replays && data.replays.length > 0) {
                                listEl.innerHTML = '';
                                data.replays.forEach(r => {
                                    const item = document.createElement('div');
                                    item.className = 'replay-item';
                                    const pathEsc = r.path.replace(/"/g, '&quot;');
                                    item.innerHTML = '<div class="replay-info"><div class="replay-name">' + r.name + '</div><div class="replay-path">' + pathEsc + '</div></div><button class="replay-open-btn" data-path="' + pathEsc + '">Open</button>';
                                    item.querySelector('.replay-open-btn').onclick = () => openReplay(r.path);
                                    listEl.appendChild(item);
                                });
                            } else {
                                listEl.innerHTML = '<p class="replay-empty">No replays found.</p>';
                            }
                        })
                        .catch(() => { document.getElementById('replaysList').innerHTML = '<p class="replay-error">Error loading replays.</p>'; });
                }
                function openReplay(path) {
                    hideReplayDialog();
                    window.location.href = '/replay?path=' + encodeURIComponent(path);
                }
                document.getElementById('replayDialog').addEventListener('click', function(e) {
                    if (e.target === this) hideReplayDialog();
                });
            </script>
        </div>
    </div>
</body>
</html>
